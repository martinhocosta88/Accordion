<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Console window background (rounded corners, dark terminal look) -->
  <rect width="256" height="256" rx="48" ry="48" fill="#1c1917"/>

  <!-- Mascot body: tall rounded capsule in Claude orange -->
  <rect x="60" y="116" width="136" height="104" rx="26" fill="#da7756"/>

  <!-- Mascot head: rounded square sitting on the body -->
  <rect x="76" y="44" width="104" height="96" rx="34" fill="#da7756"/>

  <!-- Neck seam: subtle darker line where head meets body -->
  <rect x="96" y="128" width="64" height="6" rx="3" fill="#1c1917" fill-opacity="0.25"/>

  <!-- Eyes: two dark ovals, friendly chat-bot expression -->
  <ellipse cx="108" cy="92" rx="8" ry="10" fill="#1c1917"/>
  <ellipse cx="148" cy="92" rx="8" ry="10" fill="#1c1917"/>

  <!-- Small cheek highlight for warmth -->
  <circle cx="102" cy="112" r="4" fill="#1c1917" fill-opacity="0.18"/>
  <circle cx="154" cy="112" r="4" fill="#1c1917" fill-opacity="0.18"/>

  <!-- >> prompt chevrons on the body -->
  <g stroke="#1c1917" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 92 156 L 118 176 L 92 196"/>
    <path d="M 132 156 L 158 176 L 132 196"/>
  </g>
</svg>
